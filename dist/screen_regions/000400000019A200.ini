# Shin Megami Tensei IV: Apocalypse (USA) - single-screen layout
# For the Azahar "single-screen" build (Screen Regions feature).
# Install to: %APPDATA%\Azahar\load\screen_regions\000400000019A200.ini
# Edits are picked up live (about once a second) while the game runs.
#
# Coordinates:
#   region = SRC_X SRC_Y SRC_W SRC_H -> DST_X DST_Y DST_W DST_H [opacity=0..1] [touch=0|1]
#   SRC = bottom-screen pixels (320 x 240).
#   DST = top-screen pixels (400 x 240), so overlays scale with the game view
#         at any window size. Values may be negative or exceed 400/240 to sit in
#         the side borders.
#
# Profiles may also set 'top = x y w h' (1920x1080 canvas) to move the game view,
# and a region may add 'space=window' to place it in canvas coordinates.
#
# Recommended Azahar settings: View > Screen Layout > Single Screen,
# Graphics internal resolution 5x or higher, linear filtering on.
#
# Hotkeys (Emulation > Configure > Controls > Hotkeys; bind to controller buttons):
#   Screen Regions: Toggle Overlay  - show/hide the full map (default Tab)
#   Screen Regions: Cycle Profile   - auto -> field -> battle -> menu -> auto (Ctrl+F10)
#   Screen Regions: Toggle          - turn overlays off/on (Ctrl+F9)

enabled = 1
space = top
default_profile = field
overlay_profile = map

# --- Exploration: minimap (area title + map) in the top-right corner ---------
[profile field]
hide_bottom = 1
region = 0 0 320 226 -> 286 2 112 79 opacity=0.85

# --- Battle: the complete bottom screen as one intact panel (nothing cropped or lost:
#  full command row incl. Skill/Item, skill lists, smirk markers, partner, gauges).
#  Bottom-right of the 1920x1080 canvas at 1.8x, leaving the battlefield clear.
[profile battle]
hide_bottom = 1
region = 0 0 320 240 -> 1324 638 576 432 opacity=0.96 space=window

# --- Menus / status / fusion / shops: HD-remaster style -------------------------
#  The game view stays full-screen; the menu floats over it as one panel on the
#  right, leaving the top-screen info (partners, Macca, gauges) visible on the left.
[profile menu]
hide_bottom = 1
region = 0 0 320 240 -> 1010 210 880 660 opacity=1.0 space=window

# --- Toggleable full map (drawn on top of the current profile) ---------------
# Mouse clicks on it act as touches, so the Mapper button works with a mouse.
[profile map]
hide_bottom = 1
region = 0 0 320 240 -> 40 0 320 240 opacity=0.95

# --- Automatic switching -------------------------------------------------------
# Texture rules: the group whose UI texture the game drew most recently decides the
# layout (requires Graphics > "Use Custom Textures" with the HD UI pack installed).
#   battle : battle command sheets (battle_low001, battle_low002)
#   menu   : main-menu icons, list sheet, status/skills sheet, party panel
#   field  : Mapper / map-label sheet (mapnavi005)
[auto]
rule = texture FD9DFDB47802F91E,5850FF306F7F5376 -> battle
rule = texture 43E93C8EDDF89A22,A0247897F8CD0E5B,061B285D58234C6E,732797A2299B8E5E -> menu
rule = texture E65040661516876E -> field
