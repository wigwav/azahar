# Shin Megami Tensei IV: Apocalypse (USA) - single-screen layout
# For the Azahar "single-screen" build (Screen Regions feature).
# Install to: %APPDATA%\Azahar\load\screen_regions\000400000019A200.ini
# Edits are picked up live (about once a second) while the game runs.
#
# Coordinates:
#   region = SRC_X SRC_Y SRC_W SRC_H -> DST_X DST_Y DST_W DST_H [opacity=0..1] [touch=0|1]
#   SRC = bottom-screen pixels (320 x 240).
#   DST = top-screen pixels (400 x 240), so overlays scale with the game view
#         at any window size. Values may be negative or exceed 400/240 to sit in
#         the side borders.
#
# Profiles may also set 'top = x y w h' (1920x1080 canvas) to move the game view,
# and a region may add 'space=window' to place it in canvas coordinates.
#
# Recommended Azahar settings: View > Screen Layout > Single Screen,
# Graphics internal resolution 5x or higher, linear filtering on.
#
# Hotkeys (Emulation > Configure > Controls > Hotkeys; bind to controller buttons):
#   Screen Regions: Toggle Overlay  - show/hide the full map (default Tab)
#   Screen Regions: Cycle Profile   - auto -> field -> battle -> menu -> auto (Ctrl+F10)
#   Screen Regions: Toggle          - turn overlays off/on (Ctrl+F9)

enabled = 1
space = top
default_profile = field
overlay_profile = map


# --- Exploration: minimap (area title + map) in the top-right corner ---------
[profile field]
hide_bottom = 1
region = 0 0 320 226 -> 286 2 112 79 opacity=0.85

# --- Battle -------------------------------------------------------------------
#  The game's own bottom-screen UI, rendered in HD with its background removed (HD texture
#  pack), re-laid out on native panels: hints top-left, active member portrait or the open
#  skill/item list on the left with its description, the command row centred above the
#  party, smirk badges on the party cards, partner bottom-right.
#  Battle state (active member, list open) is read from the game's battle UI object.
[profile battle]
hide_bottom = 1
hud_under = 1
region = 0 222 320 18 -> 40 18 800 45 space=window blend=screen
region = 1 40 78 90 -> 44 296 234 270 space=window blend=normal if=u32:[[[0x5b3ce4]+0x384]+0x2f8]+0x554=0 and=u32:[[[0x5b3ce4]+0x384]+0x2f8]+0x14e8=0xffffffff
region = 81 40 78 90 -> 44 296 234 270 space=window blend=normal if=u32:[[[0x5b3ce4]+0x384]+0x2f8]+0x554=1 and=u32:[[[0x5b3ce4]+0x384]+0x2f8]+0x14e8=0xffffffff
region = 161 40 78 90 -> 44 296 234 270 space=window blend=normal if=u32:[[[0x5b3ce4]+0x384]+0x2f8]+0x554=2 and=u32:[[[0x5b3ce4]+0x384]+0x2f8]+0x14e8=0xffffffff
region = 241 40 78 90 -> 44 296 234 270 space=window blend=normal if=u32:[[[0x5b3ce4]+0x384]+0x2f8]+0x554=3 and=u32:[[[0x5b3ce4]+0x384]+0x2f8]+0x14e8=0xffffffff
region = 64 40 190 98 -> 44 330 532 274 space=window blend=screen if=u32:[[[0x5b3ce4]+0x384]+0x2f8]+0x14e8!0xffffffff
region = 12 191 300 28 -> 44 638 600 56 space=window blend=screen
region = 0 146 320 46 -> 560 756 800 115 space=window blend=screen
region = 0 0 320 40 -> 400 920 1120 140 space=window blend=screen
region = 0 129 320 19 -> 1548 1016 344 40 space=window blend=screen if=u32:[[[0x5b3ce4]+0x384]+0x2f8]+0x14e8=0xffffffff

