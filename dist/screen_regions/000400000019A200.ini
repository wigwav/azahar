# Shin Megami Tensei IV: Apocalypse (USA) - single-screen layout
# For the Azahar "single-screen" build (Screen Regions feature).
# Install to: %APPDATA%\Azahar\load\screen_regions\000400000019A200.ini
# Edits are picked up live (about once a second) while the game runs.
#
# Coordinates:
#   region = SRC_X SRC_Y SRC_W SRC_H -> DST_X DST_Y DST_W DST_H [opacity=0..1] [touch=0|1]
#   SRC = bottom-screen pixels (320 x 240).
#   DST = top-screen pixels (400 x 240), so overlays scale with the game view
#         at any window size. Values may be negative or exceed 400/240 to sit in
#         the side borders.
#
# Profiles may also set 'top = x y w h' (1920x1080 canvas) to move the game view,
# and a region may add 'space=window' to place it in canvas coordinates.
#
# Recommended Azahar settings: View > Screen Layout > Single Screen,
# Graphics internal resolution 5x or higher, linear filtering on.
#
# Hotkeys (Emulation > Configure > Controls > Hotkeys; bind to controller buttons):
#   Screen Regions: Toggle Overlay  - show/hide the full map (default Tab)
#   Screen Regions: Cycle Profile   - auto -> field -> battle -> menu -> auto (Ctrl+F10)
#   Screen Regions: Toggle          - turn overlays off/on (Ctrl+F9)

enabled = 1
record = battle,menu 90 300
space = top
default_profile = field
overlay_profile = map


# --- Exploration: minimap (area title + map) in the top-right corner ---------
[profile field]
hide_bottom = 1
region = 0 0 320 226 -> 286 2 112 79 opacity=0.85

# --- Battle -------------------------------------------------------------------
#  Native HUD drawn from the game's battle data with original art (no bottom-screen crops):
#  hints top-left, the acting member's portrait, skill/item list and description bottom-left,
#  command row centred, party cards bottom-centre. The game's top screen stays full-size.
[profile battle]
hide_bottom = 1
# enemy hit animations: the game own portrait column under the card being hit
region = 0 0 80 172 -> 504 86 150 322 space=window touch=0 if==recent((smt4a_obj()!=0&&u32(smt4a_obj()+0x554)>=4&&u32(smt4a_obj()+0x554)<16&&u32(smt4a_obj()+0x14D4)==0xFFFFFFFF)&&!recent(!(smt4a_obj()!=0&&u32(smt4a_obj()+0x554)>=4&&u32(smt4a_obj()+0x554)<16&&u32(smt4a_obj()+0x14D4)==0xFFFFFFFF),1800)&&(track('ep00',pix(20,60),450)!=0||track('ep01',pix(60,80),450)!=0||track('ep02',pix(30,115),450)!=0||track('ep03',pix(55,145),450)!=0),300)
region = 80 0 80 172 -> 758 86 150 322 space=window touch=0 if==recent((smt4a_obj()!=0&&u32(smt4a_obj()+0x554)>=4&&u32(smt4a_obj()+0x554)<16&&u32(smt4a_obj()+0x14D4)==0xFFFFFFFF)&&!recent(!(smt4a_obj()!=0&&u32(smt4a_obj()+0x554)>=4&&u32(smt4a_obj()+0x554)<16&&u32(smt4a_obj()+0x14D4)==0xFFFFFFFF),1800)&&(track('ep10',pix(100,60),450)!=0||track('ep11',pix(140,80),450)!=0||track('ep12',pix(110,115),450)!=0||track('ep13',pix(135,145),450)!=0),300)
region = 160 0 80 172 -> 1012 86 150 322 space=window touch=0 if==recent((smt4a_obj()!=0&&u32(smt4a_obj()+0x554)>=4&&u32(smt4a_obj()+0x554)<16&&u32(smt4a_obj()+0x14D4)==0xFFFFFFFF)&&!recent(!(smt4a_obj()!=0&&u32(smt4a_obj()+0x554)>=4&&u32(smt4a_obj()+0x554)<16&&u32(smt4a_obj()+0x14D4)==0xFFFFFFFF),1800)&&(track('ep20',pix(180,60),450)!=0||track('ep21',pix(220,80),450)!=0||track('ep22',pix(190,115),450)!=0||track('ep23',pix(215,145),450)!=0),300)
region = 240 0 80 172 -> 1266 86 150 322 space=window touch=0 if==recent((smt4a_obj()!=0&&u32(smt4a_obj()+0x554)>=4&&u32(smt4a_obj()+0x554)<16&&u32(smt4a_obj()+0x14D4)==0xFFFFFFFF)&&!recent(!(smt4a_obj()!=0&&u32(smt4a_obj()+0x554)>=4&&u32(smt4a_obj()+0x554)<16&&u32(smt4a_obj()+0x14D4)==0xFFFFFFFF),1800)&&(track('ep30',pix(260,60),450)!=0||track('ep31',pix(300,80),450)!=0||track('ep32',pix(270,115),450)!=0||track('ep33',pix(295,145),450)!=0),300)
