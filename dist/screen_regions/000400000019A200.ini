# --- Menus / status / fusion / shops: HD-remaster style -------------------------
#  The game view stays full-screen; the menu floats over it as one panel on the
#  right, leaving the top-screen info (partners, Macca, gauges) visible on the left.
[profile menu]
hide_bottom = 1
region = 0 0 320 240 -> 1010 210 880 660 opacity=1.0 space=window

# --- Toggleable full map (drawn on top of the current profile) ---------------
# Mouse clicks on it act as touches, so the Mapper button works with a mouse.
[profile map]
hide_bottom = 1
region = 0 0 320 240 -> 40 0 320 240 opacity=0.95

# --- Automatic switching -------------------------------------------------------
# Texture rules: the group whose UI texture the game drew most recently decides the
# layout (requires Graphics > "Use Custom Textures" with the HD UI pack installed).
#   battle : battle command sheets (battle_low001, battle_low002)
#   menu   : main-menu icons, list sheet, status/skills sheet, party panel
#   field  : Mapper / map-label sheet (mapnavi005)
[auto]
rule = texture FD9DFDB47802F91E,5850FF306F7F5376 -> battle
rule = texture 43E93C8EDDF89A22,A0247897F8CD0E5B,061B285D58234C6E,732797A2299B8E5E -> menu
rule = texture E65040661516876E -> field
