# Shin Megami Tensei IV: Apocalypse (USA) - single-screen layout
# For the Azahar "single-screen" build (Screen Regions feature).
# Install to: %APPDATA%\Azahar\load\screen_regions\000400000019A200.ini
# Edits are picked up live (about once a second) while the game runs.
#
# Coordinates:
#   region = SRC_X SRC_Y SRC_W SRC_H -> DST_X DST_Y DST_W DST_H [opacity=0..1] [touch=0|1]
#   SRC = bottom-screen pixels (320 x 240).
#   DST = top-screen pixels (400 x 240), so overlays scale with the game view
#         at any window size. Values may be negative or exceed 400/240 to sit in
#         the side borders.
#
# Profiles may also set 'top = x y w h' (1920x1080 canvas) to move the game view,
# and a region may add 'space=window' to place it in canvas coordinates.
#
# Recommended Azahar settings: View > Screen Layout > Single Screen,
# Graphics internal resolution 5x or higher, linear filtering on.
#
# Hotkeys (Emulation > Configure > Controls > Hotkeys; bind to controller buttons):
#   Screen Regions: Toggle Overlay  - show/hide the full map (default Tab)
#   Screen Regions: Cycle Profile   - auto -> field -> battle -> menu -> auto (Ctrl+F10)
#   Screen Regions: Toggle          - turn overlays off/on (Ctrl+F9)

enabled = 1
record = battle,menu 90 300
space = top
default_profile = field
overlay_profile = map


# --- Exploration: minimap (area title + map) in the top-right corner ---------
[profile field]
hide_bottom = 1
region = 0 0 320 226 -> 286 2 112 79 opacity=0.85

# --- Battle -------------------------------------------------------------------
#  The game's bottom screen stays docked on the right (translucent; the mouse works as the
#  stylus), so menus, cursors and negotiation prompts are always the game's own. Native party
#  cards on the left read the live battle units.
[profile battle]
hide_bottom = 1
region = 0 0 320 240 -> 1300 150 592 444 space=window touch=1 opacity=0.85

[hud battle]
let BAT = smt4a_save() != 0 && smt4a_unit(0) != 0 && smt4a_obj() != 0
let BLINK = (time() / 280) % 2
let N0 = sjis(smt4a_save(), 0)
let P0 = 0 == 0 || smt4a_demon(0) > 0
let SMK0 = (u8(smt4a_unit(0) + 0x10E) & 0x10) != 0
let N1 = lookup('names.txt', smt4a_demon(1))
let P1 = 1 == 0 || smt4a_demon(1) > 0
let SMK1 = (u8(smt4a_unit(1) + 0x10E) & 0x10) != 0
let N2 = lookup('names.txt', smt4a_demon(2))
let P2 = 2 == 0 || smt4a_demon(2) > 0
let SMK2 = (u8(smt4a_unit(2) + 0x10E) & 0x10) != 0
let N3 = lookup('names.txt', smt4a_demon(3))
let P3 = 3 == 0 || smt4a_demon(3) > 0
let SMK3 = (u8(smt4a_unit(3) + 0x10E) & 0x10) != 0
rect 24 140 300 104 #0C0F16C8 if==$BAT&&$P0
rect 24 140 5 104 #5FD3FFFF if==$BAT&&$P0
rect 24 140 300 104 #FFD25A50 if==$BAT&&$P0 and==$SMK0&&$BLINK
text 42 148 30 #F2F4F8 left "{0}" v==$N0 fit=130 if==$BAT&&$P0
text 310 152 22 #5FD3FF right "Lv {0}" v==smt4a_level(0) if==$BAT&&$P0
image 174 150 70 25 smirk.png if==$BAT&&$P0 and==$SMK0
text 42 188 18 #8A93A3 left "HP" if==$BAT&&$P0
bar 76 196 120 10 #E8455AFF #1A1E26E0 v==smt4a_hp(0) max==max(smt4a_maxhp(0),1) if==$BAT&&$P0
text 284 186 24 #F2F4F8 right "{0}" v==min(smt4a_hp(0),9999) if==$BAT&&$P0
text 42 212 18 #8A93A3 left "MP" if==$BAT&&$P0
bar 76 220 120 10 #4C8DFFFF #1A1E26E0 v==smt4a_mp(0) max==max(smt4a_maxmp(0),1) if==$BAT&&$P0
text 284 210 24 #F2F4F8 right "{0}" v==min(smt4a_mp(0),9999) if==$BAT&&$P0
rect 24 254 300 104 #0C0F16C8 if==$BAT&&$P1
rect 24 254 5 104 #5FD3FFFF if==$BAT&&$P1
rect 24 254 300 104 #FFD25A50 if==$BAT&&$P1 and==$SMK1&&$BLINK
text 42 262 30 #F2F4F8 left "{0}" v==$N1 fit=130 if==$BAT&&$P1
text 310 266 22 #5FD3FF right "Lv {0}" v==smt4a_level(1) if==$BAT&&$P1
image 174 264 70 25 smirk.png if==$BAT&&$P1 and==$SMK1
text 42 302 18 #8A93A3 left "HP" if==$BAT&&$P1
bar 76 310 120 10 #E8455AFF #1A1E26E0 v==smt4a_hp(1) max==max(smt4a_maxhp(1),1) if==$BAT&&$P1
text 284 300 24 #F2F4F8 right "{0}" v==min(smt4a_hp(1),9999) if==$BAT&&$P1
text 42 326 18 #8A93A3 left "MP" if==$BAT&&$P1
bar 76 334 120 10 #4C8DFFFF #1A1E26E0 v==smt4a_mp(1) max==max(smt4a_maxmp(1),1) if==$BAT&&$P1
text 284 324 24 #F2F4F8 right "{0}" v==min(smt4a_mp(1),9999) if==$BAT&&$P1
rect 24 368 300 104 #0C0F16C8 if==$BAT&&$P2
rect 24 368 5 104 #5FD3FFFF if==$BAT&&$P2
rect 24 368 300 104 #FFD25A50 if==$BAT&&$P2 and==$SMK2&&$BLINK
text 42 376 30 #F2F4F8 left "{0}" v==$N2 fit=130 if==$BAT&&$P2
text 310 380 22 #5FD3FF right "Lv {0}" v==smt4a_level(2) if==$BAT&&$P2
image 174 378 70 25 smirk.png if==$BAT&&$P2 and==$SMK2
text 42 416 18 #8A93A3 left "HP" if==$BAT&&$P2
bar 76 424 120 10 #E8455AFF #1A1E26E0 v==smt4a_hp(2) max==max(smt4a_maxhp(2),1) if==$BAT&&$P2
text 284 414 24 #F2F4F8 right "{0}" v==min(smt4a_hp(2),9999) if==$BAT&&$P2
text 42 440 18 #8A93A3 left "MP" if==$BAT&&$P2
bar 76 448 120 10 #4C8DFFFF #1A1E26E0 v==smt4a_mp(2) max==max(smt4a_maxmp(2),1) if==$BAT&&$P2
text 284 438 24 #F2F4F8 right "{0}" v==min(smt4a_mp(2),9999) if==$BAT&&$P2
rect 24 482 300 104 #0C0F16C8 if==$BAT&&$P3
rect 24 482 5 104 #5FD3FFFF if==$BAT&&$P3
rect 24 482 300 104 #FFD25A50 if==$BAT&&$P3 and==$SMK3&&$BLINK
text 42 490 30 #F2F4F8 left "{0}" v==$N3 fit=130 if==$BAT&&$P3
text 310 494 22 #5FD3FF right "Lv {0}" v==smt4a_level(3) if==$BAT&&$P3
image 174 492 70 25 smirk.png if==$BAT&&$P3 and==$SMK3
text 42 530 18 #8A93A3 left "HP" if==$BAT&&$P3
bar 76 538 120 10 #E8455AFF #1A1E26E0 v==smt4a_hp(3) max==max(smt4a_maxhp(3),1) if==$BAT&&$P3
text 284 528 24 #F2F4F8 right "{0}" v==min(smt4a_hp(3),9999) if==$BAT&&$P3
text 42 554 18 #8A93A3 left "MP" if==$BAT&&$P3
bar 76 562 120 10 #4C8DFFFF #1A1E26E0 v==smt4a_mp(3) max==max(smt4a_maxmp(3),1) if==$BAT&&$P3
text 284 552 24 #F2F4F8 right "{0}" v==min(smt4a_mp(3),9999) if==$BAT&&$P3

# --- Menus ------------------------------------------------------------------------
#  Same dock as battle, more transparent.
[profile menu]
hide_bottom = 1
region = 0 0 320 240 -> 1300 150 592 444 space=window touch=1 opacity=0.7

# --- Toggleable full map (drawn on top of the current profile) ---------------
# Mouse clicks on it act as touches, so the Mapper button works with a mouse.
[profile map]
hide_bottom = 1
region = 0 0 320 240 -> 40 0 320 240 opacity=0.95

# --- Automatic switching -------------------------------------------------------
# Texture rules: the group whose UI texture the game drew most recently decides the
# layout (requires Graphics > "Use Custom Textures" with the HD UI pack installed).
#   battle : battle command sheets (battle_low001, battle_low002)
#   menu   : main-menu icons, list sheet, status/skills sheet, party panel
#   field  : Mapper / map-label sheet (mapnavi005)
[auto]
rule = texture FD9DFDB47802F91E,5850FF306F7F5376 -> battle
rule = texture 43E93C8EDDF89A22,A0247897F8CD0E5B,061B285D58234C6E,732797A2299B8E5E -> menu
rule = texture E65040661516876E -> field
