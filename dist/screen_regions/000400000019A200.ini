# Shin Megami Tensei IV: Apocalypse (USA) - single-screen layout
# For the Azahar "single-screen" build (Screen Regions feature).
# Install to: %APPDATA%\Azahar\load\screen_regions\000400000019A200.ini
# Edits are picked up live (about once a second) while the game runs.
#
# Coordinates:
#   region = SRC_X SRC_Y SRC_W SRC_H -> DST_X DST_Y DST_W DST_H [opacity=0..1] [touch=0|1]
#   SRC = bottom-screen pixels (320 x 240).
#   DST = top-screen pixels (400 x 240), so overlays scale with the game view
#         at any window size. Values may be negative or exceed 400/240 to sit in
#         the side borders.
#
# Profiles may also set 'top = x y w h' (1920x1080 canvas) to move the game view,
# and a region may add 'space=window' to place it in canvas coordinates.
#
# Recommended Azahar settings: View > Screen Layout > Single Screen,
# Graphics internal resolution 5x or higher, linear filtering on.
#
# Hotkeys (Emulation > Configure > Controls > Hotkeys; bind to controller buttons):
#   Screen Regions: Toggle Overlay  - show/hide the full map (default Tab)
#   Screen Regions: Cycle Profile   - auto -> field -> battle -> menu -> auto (Ctrl+F10)
#   Screen Regions: Toggle          - turn overlays off/on (Ctrl+F9)

enabled = 1
record = battle,menu 90 300
space = top
default_profile = field
overlay_profile = map


# --- Exploration: minimap (area title + map) in the top-right corner ---------
[profile field]
hide_bottom = 1
region = 0 0 320 226 -> 286 2 112 79 opacity=0.85

# --- Battle -------------------------------------------------------------------
#  Native HUD drawn from the game's battle data with original art (no bottom-screen crops):
#  hints top-left, the acting member's portrait, skill/item list and description bottom-left,
#  command row centred, party cards bottom-centre. The game's top screen stays full-size.
[profile battle]
hide_bottom = 1

[hud battle]
let O = smt4a_obj()
let A = $O ? u32($O + 0x554) : -1
let BAT = $O != 0 && smt4a_save() != 0 && smt4a_unit(0) != 0
let M = u32($O + 0x18A0)
let DL = u32(0x57F268)
let DLON = $BAT && $DL != 0
let POP = $BAT && $M == 11 && u32($O + 0xE64C) != 0
let CD = smt4a_cmddesc(0)
let ON = recent($BAT && $A >= 0 && $A <= 3 && ($M == 11 || $M == 16) && !$DLON && !$POP, 250)
let TGT = $ON && $M == 16
let BLINK = (time() / 280) % 2
let CUR = u32($O + 0x5C8 + $A * 0x64)
let NC = smt4a_cmdcount($A)
let CMD = smt4a_cmd($A, $CUR)
let LON = u32($O + 0x113FC) == 1
let SKL = $ON && $LON && $CMD == 0
let ITM = $ON && $LON && $CMD == 1
let LIST = $SKL || $ITM
let TALK = $BAT && $M == 0 && $A >= 0 && $A <= 3 && $CMD == 2 && u32($O + 0x898) == 0
let CLEAR = $DLON || $M == 13 || $M == 14 || $TALK
let SC = u32($O + 0x764)
let SN = smt4a_entries($A)
let ST = clamp($SC - 2, 0, max($SN - 6, 0))
let MP = smt4a_mp($A)
let IC = u32($O + 0x82C)
let IN = smt4a_item(0) == 0 ? 0 : smt4a_item(1) == 0 ? 1 : smt4a_item(2) == 0 ? 2 : smt4a_item(3) == 0 ? 3 : smt4a_item(4) == 0 ? 4 : smt4a_item(5) == 0 ? 5 : smt4a_item(6) == 0 ? 6 : smt4a_item(7) == 0 ? 7 : smt4a_item(8) == 0 ? 8 : smt4a_item(9) == 0 ? 9 : smt4a_item(10) == 0 ? 10 : smt4a_item(11) == 0 ? 11 : smt4a_item(12) == 0 ? 12 : smt4a_item(13) == 0 ? 13 : smt4a_item(14) == 0 ? 14 : smt4a_item(15) == 0 ? 15 : smt4a_item(16) == 0 ? 16 : smt4a_item(17) == 0 ? 17 : smt4a_item(18) == 0 ? 18 : smt4a_item(19) == 0 ? 19 : smt4a_item(20) == 0 ? 20 : smt4a_item(21) == 0 ? 21 : smt4a_item(22) == 0 ? 22 : smt4a_item(23) == 0 ? 23 : smt4a_item(24) == 0 ? 24 : smt4a_item(25) == 0 ? 25 : smt4a_item(26) == 0 ? 26 : smt4a_item(27) == 0 ? 27 : smt4a_item(28) == 0 ? 28 : smt4a_item(29) == 0 ? 29 : smt4a_item(30) == 0 ? 30 : smt4a_item(31) == 0 ? 31 : smt4a_item(32) == 0 ? 32 : smt4a_item(33) == 0 ? 33 : smt4a_item(34) == 0 ? 34 : smt4a_item(35) == 0 ? 35 : smt4a_item(36) == 0 ? 36 : smt4a_item(37) == 0 ? 37 : smt4a_item(38) == 0 ? 38 : smt4a_item(39) == 0 ? 39 : 40
let IT = clamp($IC - 2, 0, max($IN - 6, 0))
let BU = $A == 0 ? 'nanashi' : lookup('bu_index.txt', smt4a_demon($A))
let PNAME = $A == 0 ? sjis(smt4a_save(), 0) : lookup('names.txt', smt4a_demon($A))
let N0 = sjis(smt4a_save(), 0)
let P0 = smt4a_save() != 0 && (0 == 0 || smt4a_demon(0) > 0)
let SMK0 = (u8(smt4a_unit(0) + 0x10E) & 0x10) != 0
let N1 = lookup('names.txt', smt4a_demon(1))
let P1 = smt4a_save() != 0 && (1 == 0 || smt4a_demon(1) > 0)
let SMK1 = (u8(smt4a_unit(1) + 0x10E) & 0x10) != 0
let N2 = lookup('names.txt', smt4a_demon(2))
let P2 = smt4a_save() != 0 && (2 == 0 || smt4a_demon(2) > 0)
let SMK2 = (u8(smt4a_unit(2) + 0x10E) & 0x10) != 0
let N3 = lookup('names.txt', smt4a_demon(3))
let P3 = smt4a_save() != 0 && (3 == 0 || smt4a_demon(3) > 0)
let SMK3 = (u8(smt4a_unit(3) + 0x10E) & 0x10) != 0
let TD = $LIST ? smt4a_skilldesc(1) : ''
let TALL = has($TD, 'allies') || has($TD, 'party') || has($TD, 'Party')
let TSELF = has($TD, 'Self') || has($TD, 'self')
let TONE = has($TD, '1 ally')
let TCUR = u32($O + 0x8E8)

